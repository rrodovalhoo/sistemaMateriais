<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sistema de Materiais</title>
</head>
<body>
    <div class="card">
        <header class="card-header">
            <h2>
                <img src="informatica.png" alt="Ícone de informática" class="icone-usuario">
                Sistema de Materiais
            </h2>
        </header>

        <div class="card-body">
            <h4 class="descricao">
                Bem-vindo ao Sistema de Materiais Zero77.
            </h4>

            <label for="nome">Nome do Item:</label>
            <input type="text" id="nome" placeholder="Ex: Monitor">

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" step="1" min="1" placeholder="Ex: 7">

            <button id="btnContar">Contar</button>
            <button id="btnAdd">Adicionar</button>
            <button id="btnRemover">Remover</button>

            <input type="text" id="resultado" placeholder="Resultado aparecerá aqui" readonly>

            <hr>
            <h4>Inventário atual:</h4>
            <ul id="listaInventario"></ul>

            <hr>
            <div id="Regras">
                <h4>Regras de Sistemas:</h4>
                <ul>
                    <li>Informe o Nome do Item</li>
                    <li>Informe a Quantidade do Item</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="materiais.js"></script>
</body>
</html>
